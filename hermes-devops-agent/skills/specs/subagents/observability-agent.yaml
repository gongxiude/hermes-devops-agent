name: observability-agent
role: "Read-only metrics, logs, dashboards, alerts, and SLO evidence collection."
allowed_layers: [L0, L1, L2, L4]
allowed_skills:
  - promql-basics
  - loki-logql-basics
  - prometheus-query-tool
  - loki-query-tool
  - observability-health-query
  - skill-policy-gate
  - secret-redaction
  - audit-trail
mcp_servers:
  - prometheus-intlsms-prod
  - prometheus-intlsms-test
  - loki-intlsms-prod
  - loki-intlsms-test
denied_tools:
  - terminal
  - file_write
  - alert_rule_write
output_schema: observability_evidence.v1
