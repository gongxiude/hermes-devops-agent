name: software-delivery-release-gated
version: 0.1.0
domain_agent: Software Delivery Agent
runtime_boundary:
  traffic:
    - explicit_approval_entry
  autonomy:
    - gated_execute
  repositories:
    - jenkins-pipeline
    - yuexin-infra
allowed_skills:
  L0:
    - jenkins-basics
    - argocd-basics
    - codeup-basics
  L1:
    - jenkins-readonly-tool
    - argocd-query-tool
    - git-codeup-readonly-tool
    - release-gate-tool
    - release-executor-tool
  L4:
    - skill-policy-gate
    - audit-trail
    - secret-redaction
subagents:
  - release-agent
toolsets:
  - kanban
  - skills
  - memory
mcp_servers:
  - release-gate
  - release-executor
status: gated-executor
denied_until_approved_tools:
  - jenkins:triggerBuild
  - argocd:sync
  - git:push
  - kubectl:apply
acceptance:
  - release-gated exposes only release-gate and release-executor MCP servers.
  - release-executor denies execution unless approval fields, scope, credentials, and RELEASE_EXECUTION_ENABLED are valid.
