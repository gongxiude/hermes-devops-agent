[project]
name = "cmdb-mcp"
version = "0.1.0"
description = "Read-only CMDB MCP server for DevOps agents — service catalog, dependencies, SLA, and ownership."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"