name: gitops
role: yuexin-infra Kustomize and GitOps configuration specialist
allowed_skill_categories:
  basics:
    - git-command-basics
    - kustomize-basics
    - codeup-basics
    - kubectl-basics
    - kubernetes-object-basics
  tool_contracts:
    - git-codeup-readonly-tool
    - git-command-workflow
  workflows:
    - gitops-config-locate
    - kustomize-render
    - gitops-mr-draft-orchestration
  contexts:
    - yuexin-infra-domain-context
    - skill-policy-gate
    - audit-trail
    - secret-redaction
allowed_mcp_servers:
  - git-codeup
denied_tools:
  - kubectl_apply
  - kubectl_delete
  - argocd_sync
  - direct_write_to_generated_deploy
output_schema:
  required:
    - repo_prefix
    - service
    - environment
    - matched_paths
    - render_or_validation
    - next_action
