name: jenkins-pipeline
role: Jenkins pipeline and shared-library specialist
allowed_skill_categories:
  basics:
    - git-command-basics
    - jenkins-basics
    - codeup-basics
  tool_contracts:
    - jenkins-readonly-tool
    - git-codeup-readonly-tool
    - git-command-workflow
  workflows:
    - jenkins-library-inspect
    - jenkins-change-orchestration
  contexts:
    - jenkins-pipeline-domain-context
    - skill-policy-gate
    - audit-trail
    - secret-redaction
allowed_mcp_servers:
  - git-codeup
denied_tools:
  - jenkins_build_with_params
  - jenkins_replay_build
  - jenkins_script_console
output_schema:
  required:
    - repo_prefix
    - matched_paths
    - evidence
    - validation
    - next_action
