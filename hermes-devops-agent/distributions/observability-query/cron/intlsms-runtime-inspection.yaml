name: intlsms-runtime-inspection
description: "Inspect international SMS production runtime state every 15 minutes."
profile: observability-query
schedule: "*/15 * * * *"
timezone: Asia/Shanghai
enabled: true
command:
  - python3
  - mcp-servers/devops-observe/intlsms_runner.py
  - --environment
  - prod
  - --format
  - markdown
  - --output-dir
  - reports
output:
  type: report
  audit_required: true
  redaction_required: true
policy:
  autonomy:
    - observe
    - recommend
  denied_actions:
    - restart
    - rollback
    - scale
    - sync
    - apply
    - patch
    - delete
    - db_change
