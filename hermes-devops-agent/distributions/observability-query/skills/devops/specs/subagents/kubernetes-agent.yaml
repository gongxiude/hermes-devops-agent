name: kubernetes-agent
role: "Read-only Kubernetes state, workload health, resource, event, and rollout diagnosis."
allowed_layers: [L0, L1, L2, L4]
allowed_skills:
  - kubectl-basics
  - kubernetes-object-basics
  - k8s-readonly-tool
  - kubernetes-debug
  - skill-policy-gate
  - secret-redaction
  - audit-trail
mcp_servers:
  - devops-observe
denied_tools:
  - kubectl_patch
  - kubectl_delete
  - kubectl_exec_write
  - kubectl_apply
output_schema: kubernetes_evidence.v1
