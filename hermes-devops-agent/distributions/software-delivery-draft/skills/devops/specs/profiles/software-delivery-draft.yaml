name: software-delivery-draft
version: 0.1.0
domain_agent: Software Delivery Agent
runtime_boundary:
  traffic:
    - kanban_worker
    - cli
  autonomy:
    - observe
    - recommend
    - draft
  repositories:
    - jenkins-pipeline
    - yuexin-infra
allowed_skills:
  L0:
    - jenkins-basics
    - argocd-basics
    - codeup-basics
  L1:
    - git-codeup-readonly-tool
    - git-workspace-draft-tool
  L2:
    - gitops-config-query
    - jenkins-library-query
    - gitops-mr-draft
    - jenkins-library-mr-draft
  L3:
    - software-delivery-draft
  L4:
    - skill-policy-gate
    - audit-trail
    - secret-redaction
  L5:
    - chat-ops-entry
subagents:
  - gitops-agent
toolsets:
  - kanban
  - skills
  - memory
mcp_servers:
  - git-codeup
  - git-workspace
denied_tools:
  - argocd:sync
  - jenkins:triggerBuild
  - git:push
  - git:merge
acceptance:
  - software-delivery-draft can create isolated worktrees for jenkins-pipeline and yuexin-infra.
  - software-delivery-draft returns diff and validation evidence before MR draft handoff.
