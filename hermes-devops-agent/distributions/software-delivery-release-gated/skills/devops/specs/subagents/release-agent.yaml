name: release-agent
role: Jenkins and ArgoCD read-only delivery evidence collector
allowed_skills:
  - jenkins-basics
  - argocd-basics
  - codeup-basics
  - jenkins-readonly-tool
  - argocd-query-tool
  - git-codeup-readonly-tool
  - jenkins-library-query
  - release-impact-analysis
  - audit-trail
denied_actions:
  - jenkins_trigger_build
  - jenkins_replay_build
  - argocd_sync
output_schema:
  required:
    - systems_checked
    - evidence
    - unknowns
