name: devops-orchestrator
version: 0.1.0
domain_agent: DevOps Orchestrator
runtime_boundary:
  traffic:
    - feishu_chatops
  autonomy:
    - route
    - notify
  workspace: none
  secrets:
    - FEISHU_APP_ID
    - FEISHU_APP_SECRET
allowed_skills:
  L3:
    - intent-parse
    - kanban-route
    - result-notify
toolsets:
  - kanban
  - skills
  - memory
mcp_servers: []
enabled_tools:
  - kanban:kanban_create
  - kanban:kanban_get
  - kanban:kanban_list
  - kanban:delegate_task
  - hermes:profile_list
denied_tools:
  - prometheus-intlsms-prod:prometheus_query
  - prometheus-intlsms-test:prometheus_query
  - loki-intlsms-prod:loki_query_range
  - loki-intlsms-test:loki_query_range
  - k8s-intlsms-prod:k8s_get_resources
  - k8s-intlsms-test:k8s_get_resources
  - devops-prod-breakglass:prod_restart_workload
  - devops-prod-breakglass:prod_scale_workload
  - devops-gitops-draft:argocd_sync
  - devops-gitops-draft:kubectl_apply
route_targets:
  gitops_query: software-delivery-readonly
  gitops_draft: software-delivery-draft
entry_rules:
  no_mutation: true
  no_direct_ops: true
  require_kanban_audit: true
  no_profile_switch: false
acceptance:
  - "hermes profile use devops-orchestrator"
  - "hermes tools list must not show devops-observe or devops-prod-breakglass tools"
  - "send feishu message with service=intlsms, request_type=observability_query → kanban task created with correct assignee"
  - "send feishu message with urgency=urgent → delegate_task fired AND kanban audit task created"
