display:
  skin: slate

hooks_auto_accept: false

# Model — 使用 custom provider 指向内部 LLM relay
# 安装后在 profile config.yaml 中填入真实 base_url / api_key
model:
  provider: custom
  model: gpt-5.4
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${LLM_RELAY_API_KEY}"
  api_mode: chat_completions

# Orchestrator 只有 kanban + skills，不挂任何 MCP 生产系统
toolsets:
  - kanban
  - skills
  - memory

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 3     # 降低调度延迟（原 15s）
  max_in_progress: 10
  max_in_progress_per_profile: 3
  failure_limit: 2
  auto_promote_children: true
  auto_decompose: false             # 关闭自动任务拆解，减少调度噪音
  orchestrator_profile: devops-orchestrator

platforms:
  feishu:
    enabled: true
    extra:
      connection_mode: websocket
      domain: feishu
      allow_bots: none
      require_mention: true
      # default_group_policy: allowlist  # 改为 open 则所有群组均可访问
      default_group_policy: open
