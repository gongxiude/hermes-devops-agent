display:
  skin: slate

hooks_auto_accept: false

model:
  provider: deepseek-relay
  model: deepseek-v4-pro
  default: deepseek-v4-pro
  api_mode: chat_completions

fallback_providers:
- provider: custom
  model: deepseek-v4-pro
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${LLM_RELAY_API_KEY}"
  api_mode: chat_completions


custom_providers:
- name: deepseek-relay
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${LLM_RELAY_API_KEY}"
  model: deepseek-v4-pro
  api_mode: chat_completions
  models:
    deepseek-v4-pro:
      name: deepseek-v4-pro

- name: gpt-relay
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${LLM_RELAY_API_KEY}"
  model: gpt-5.5
  api_mode: chat_completions
  models:
    gpt-5.5:
      name: gpt-5.5

agent:
  max_turns: 18

plugins:
  enabled: []

toolsets:
  - kanban
  - skills
  - memory
  - terminal
  - delegation

terminal:
  cwd: /opt/data/profiles/infra-agent/workspace

mcp_servers:
  aliyun:
    command: /opt/hermes/.venv/bin/python
    args:
      - /opt/mcp-servers/aliyun/src/server.py
    env:
      MCP_SERVER_NAME: aliyun
      ALIYUN_ACCESS_KEY_ID: "${ALIYUN_ACCESS_KEY_ID}"
      ALIYUN_ACCESS_KEY_SECRET: "${ALIYUN_ACCESS_KEY_SECRET}"
      ALIYUN_REGION: "${ALIYUN_REGION}"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - aliyun_ecs_describe_instances
        - aliyun_ecs_describe_instance_types
        - aliyun_cms_describe_metric_last
        - aliyun_cms_describe_metric_list
  k8s-readonly:
    command: /opt/hermes/.venv/bin/python
    args:
      - /opt/mcp-servers/k8s/src/server.py
    env:
      MCP_SERVER_NAME: k8s-readonly
      K8S_CONTEXT: "${K8S_CONTEXT}"
      KUBECONFIG: "${KUBECONFIG_READONLY}"
      KUBECTL_BIN: "${KUBECTL_BIN}"
      K8S_READ_ONLY: "true"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - k8s_get_resources
        - k8s_get_pod_logs
        - k8s_get_events
        - k8s_get_available_api_resources
        - k8s_get_cluster_configuration
        - k8s_get_resource_yaml
        - k8s_describe_resource

kanban:
  dispatch_in_gateway: false

infra_agent:
  profile: infra-agent
  service_domain: alicloud
  autonomy:
    - observe
    - recommend
  default_region: cn-hangzhou
  supported_environments:
    - prod
  readonly: true
  report_format: markdown
