name: devops-shared-skills
version: 0.2.0
description: "Shared layered skill catalog for the Hermes DevOps Agent repository."
layers:
  L0:
    description: "基础使用 skills，不直接授予 live 权限。"
    skills:
      - name: promql-basics
        path: basics/promql-basics/SKILL.md
      - name: loki-logql-basics
        path: basics/loki-logql-basics/SKILL.md
      - name: kubectl-basics
        path: basics/kubectl-basics/SKILL.md
      - name: kubernetes-object-basics
        path: basics/kubernetes-object-basics/SKILL.md
  L1:
    description: "MCP tool contracts — schema、allow/deny、audit。"
    skills:
      - name: prometheus-query-tool
        path: tool-contracts/prometheus-query-tool/SKILL.md
      - name: loki-query-tool
        path: tool-contracts/loki-query-tool/SKILL.md
      - name: k8s-readonly-tool
        path: tool-contracts/k8s-readonly-tool/SKILL.md
    catalogs:
      - path: tool-contracts/catalog.yaml
  L2:
    description: "单一功能能力 skills。"
    skills:
      - name: observability-health-query
        path: capabilities/observability-health-query/SKILL.md
      - name: kubernetes-debug
        path: capabilities/kubernetes-debug/SKILL.md
  L3:
    description: "场景编排 skills。"
    skills:
      - name: intlsms-runtime-inspection
        path: orchestration/intlsms-runtime-inspection/SKILL.md
  L4:
    description: "治理与领域上下文，不授予权限。"
    skills:
      - name: skill-policy-gate
        path: governance/skill-policy-gate/SKILL.md
      - name: audit-trail
        path: governance/audit-trail/SKILL.md
      - name: secret-redaction
        path: governance/secret-redaction/SKILL.md
    domains:
      - name: intlsms-runtime-inspection
        path: governance/domains/intlsms-runtime-inspection.yaml
  L5:
    description: "已进入 profile 后的请求标准化。"
    skills:
      - name: chat-ops-entry
        path: entry/chat-ops-entry/SKILL.md
      - name: scheduled-entry
        path: entry/scheduled-entry/SKILL.md
    catalogs:
      - path: entry/catalog.yaml
specs:
  subagents:
    - name: observability-agent
      path: specs/subagents/observability-agent.yaml
    - name: kubernetes-agent
      path: specs/subagents/kubernetes-agent.yaml
    - name: governance-reviewer
      path: specs/subagents/governance-reviewer.yaml
  profiles:
    - name: observability-query
      path: specs/profiles/observability-query.yaml
