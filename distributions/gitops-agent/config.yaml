display:
  skin: slate

hooks_auto_accept: false

model:
  provider: deepseek-relay
  model: deepseek-v4-pro
  default: deepseek-v4-pro
  api_mode: chat_completions

fallback_providers:
- provider: custom
  model: deepseek-v4-pro
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${DEEPSEEK_RELAY_API_KEY}"
  api_mode: chat_completions


custom_providers:
- name: deepseek-relay
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${DEEPSEEK_RELAY_API_KEY}"
  model: deepseek-v4-pro
  api_mode: chat_completions
  models:
    deepseek-v4-pro:
      name: deepseek-v4-pro

- name: gpt-relay
  base_url: "${LLM_RELAY_BASE_URL}"
  api_key: "${GPT_RELAY_API_KEY}"
  model: gpt-5.5
  api_mode: chat_completions
  models:
    gpt-5.5:
      name: gpt-5.5

agent:
  max_turns: 24

plugins:
  enabled:
    - argocd
    - kubernetes

toolsets:
  - kanban
  - skills
  - memory
  - terminal
  - delegation

terminal:
  cwd: "${SOFTWARE_DELIVERY_WORKSPACE_ROOT}"

mcp_servers:
  git-codeup:
    command: /opt/hermes/.venv/bin/python
    args:
      - /opt/mcp-servers/git-codeup/src/server.py
    env:
      MCP_SERVER_NAME: git-codeup
      CODEUP_BASE_URL: "${CODEUP_BASE_URL}"
      CODEUP_ACCESS_TOKEN: "${CODEUP_ACCESS_TOKEN}"
      CODEUP_ORGANIZATION_ID: "${CODEUP_ORGANIZATION_ID}"
      LOCAL_GIT_ROOT: "${SOFTWARE_DELIVERY_WORKSPACE_ROOT}"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - codeup_list_repositories
        - codeup_list_change_requests
        - codeup_get_change_request
        - codeup_list_commits
        - git_repo_status
        - codeup_create_change_request
  jenkins:
    transport: streamable_http
    sampling:
      enabled: false
    elicitation:
      enabled: false
    url: "${JENKINS_MCP_URL}"
    headers:
      Authorization: "${JENKINS_MCP_AUTHORIZATION}"
    tools:
      include:
        - whoAmI
        - getStatus
        - getJobs
        - findJobsWithScmUrl
        - getJob
        - getJobScm
        - getBuild
        - getBuildScm
        - getBuildChangeSets
        - getBuildLog
        - searchBuildLog
        - getQueueItem
        - getTestResults
        - getFlakyFailures
  # argocd 已从 MCP 迁移到原生 argocd 插件(plugins.enabled + 下方 argocd: catalog)

# argocd 插件 catalog(单控制面,只读)。连接走 ${ARGOCD_SERVER}/${ARGOCD_TOKEN}。
argocd:
  argocd:
    default_env: prod
    targets:
      - id: prod
        env: prod
        base_url: "${ARGOCD_SERVER}"
        token: "${ARGOCD_TOKEN}"
        auth_scheme: Bearer

# kubernetes 插件只读多集群：用于查看当前集群运行态，辅助判断 GitOps 变更影响。
# 所有集群访问走只读 kubeconfig；生产写操作必须继续通过 GitOps/ArgoCD。
kubernetes:
  default_category: ai
  default_env: prod

# 共享集群注册表。GitOps agent 主要用于确认 GitOps 目标和当前运行态是否一致。
clusters:
  prod-aliyun-zjk-ai:
    category: ai
    env: prod
    cluster: aliyun-zjk
    server: https://kubernetes.default.svc
    namespace: yuexin-ai
    context: prod-aliyun-zjk-ops
  prod-aliyun-zjk-ops:
    category: ops
    env: prod
    cluster: aliyun-zjk
    server: https://kubernetes.default.svc
    namespace: ""
    context: prod-aliyun-zjk-ops
  test-aliyun-zjk-datacenter:
    category: datacenter
    env: test
    cluster: aliyun-zjk
    server: https://47.92.210.170:6443
    namespace: test
    context: test-aliyun-zjk-datacenter

kanban:
  dispatch_in_gateway: false
