      - /Users/gongxiude/Documents/Obsidian/AI/Decisions/2026-04-14-my-world-infra-config-path-convention.md
      - /Users/gongxiude/Documents/Obsidian/AI/Decisions/2026-04-14-my-world-infra-kustomize-configmap-scalar-style.md
environments:
  prod:
    allowed_autonomy: [observe, recommend, draft]
    write_requires_approval: true
  test:
    allowed_autonomy: [observe, recommend, draft]
    write_requires_approval: false
rules:
  terminal_git:
    - Every GitOps operation must begin with git fetch --prune and git pull --ff-only.
    - Draft changes must use a branch named hermes/<task_id>/<purpose>.
    - Draft changes must run repository validation commands before commit or push.
    - Clone, fetch, pull, commit, and push use direct git commands in Hermes terminal, not Git MCP tools.
    - Runtime operations must not use /Users/gongxiude/Documents/my-world as the workspace.
  yuexin_infra:
    - Edit environment-specific configuration in overlays first.
    - Do not manually edit generated deploy/per-cluster files.
    - Do not use argocd app set --kustomize-image to bypass GitOps state.
    - Validate with bin/validate-conf, bin/generate-argo, kustomize build, or bin/yaml-lint according to change scope.
  jenkins_pipeline:
    - Prefer direct readable Groovy flow over unnecessary helper extraction.
    - vars/*.groovy shared-library steps use def call(Map args = [:]) unless legacy code proves otherwise.
    - Do not hardcode credentials, webhooks, tokens, AK/SK, or kubeconfigs.
    - For multi-layer templates, preserve interpolation boundaries with explicit placeholders.
