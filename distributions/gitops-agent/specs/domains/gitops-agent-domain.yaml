      - /Users/gongxiude/Documents/Obsidian/AI/Decisions/2026-04-14-my-world-template-interpolation-boundary-rule.md
  yuexin-infra:
    remote: git@codeup.aliyun.com:6316fd51cb9d00684879aa3a/devops/yuexin-infra.git
    branch: master
    kind: gitops-kubernetes-infra
    ownership: gitops-agent terminal workspace checkout
