name: hermes-devops-observability
version: 0.1.0
description: "Read-only observability agent for international SMS runtime inspection and health queries."
hermes_requires: ">=0.12.0"
author: "Platform Engineering"
env_requires:
  - name: OBSERVE_PROMETHEUS_BASE_URL_PROD
    description: "Prometheus base URL for production"
    required: true
  - name: OBSERVE_LOKI_BASE_URL_PROD
    description: "Loki base URL for production"
    required: true
  - name: KUBECONFIG_READONLY_PROD
    description: "Read-only kubeconfig path for production cluster"
    required: true
  - name: OBSERVE_PROMETHEUS_BASE_URL_TEST
    description: "Prometheus base URL for test environment"
    required: false
  - name: KUBECONFIG_READONLY_TEST
    description: "Read-only kubeconfig path for test cluster"
    required: false
  - name: CUSTOM_BASE_URL
    description: "OpenAI-compatible LLM relay base URL for the default observability model"
    required: true
  - name: CUSTOM_API_KEY
    description: "LLM relay API key for the default observability model"
    required: true
  - name: GPT_RELAY_API_KEY
    description: "Optional GPT relay API key for fallback or manual testing"
    required: false
distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - cron/
