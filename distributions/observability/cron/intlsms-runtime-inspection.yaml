name: intlsms-runtime-inspection
description: "Inspect international SMS production runtime state every 15 minutes."
profile: observability
schedule: "*/15 * * * *"
timezone: Asia/Shanghai
enabled: true
command:
  - hermes
  - -p
  - observability
  - chat
  - -q
  - "执行国际短信生产环境巡检。只允许使用 prometheus-intlsms-prod、loki-intlsms-prod、k8s-intlsms-prod 独立 MCP；禁止调用 mcp_devops_observe_*；输出短巡检报告和风险项。"
  - -Q
output:
  type: report
  audit_required: true
  redaction_required: true
policy:
  autonomy:
    - observe
    - recommend
  denied_actions:
    - restart
    - rollback
    - scale
    - sync
    - apply
    - patch
    - delete
    - db_change
