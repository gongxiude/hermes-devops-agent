# Profile-specific settings
observability_query:
  service_domain: intlsms
  agent_distribution: hermes-devops-agent
  supported_environments:
    - prod
    - test
  default_environment: prod
  default_window: 15m
  max_window: 2h
  report_format: markdown
  readonly: true

# observability 插件的多实例 catalog（按后端分段）。
# 工具根据提示词选择 业务线/环境/集群 → 命中唯一 target → 用其 base_url/token 连接。
# base_url/token 写 ${VAR}，由 load_config() 自动从 .env 展开。
# 新增业务线/实例：在对应后端 targets 追加一条 + .env 加变量，无需改代码。
observability:
  prometheus:
    default_business_line: intlsms
    default_environment: prod
    targets:
      - id: intlsms-prod
        business_line: intlsms
        environment: prod
        cluster: prod-aliyun-sg
        base_url: "${OBSERVE_PROMETHEUS_BASE_URL_PROD}"
        token: "${OBSERVE_PROMETHEUS_TOKEN_PROD}"
        auth_scheme: Basic
      - id: intlsms-test
        business_line: intlsms
        environment: test
        cluster: test-aliyun-zjk
        base_url: "${OBSERVE_PROMETHEUS_BASE_URL_TEST}"
        token: "${OBSERVE_PROMETHEUS_TOKEN_TEST}"
        auth_scheme: Bearer
  # loki:            # 【未来】结构同上；target 增加 username/password 等 loki 专属字段
  #   default_business_line: intlsms
  #   default_environment: prod
  #   targets: []

# kubernetes 插件的多集群 catalog(只读)。每个 target = 一个集群。
# 集群由 context 选择(一个 kubeconfig 多 context);连接细节从 .env 展开。
# 所有集群变更走 GitOps —— 本插件只读,绝不 mutate。
kubernetes:
  k8s:
    default_business_line: intlsms
    default_environment: prod
    targets:
      - id: intlsms-prod
        business_line: intlsms
        environment: prod
        cluster: prod-aliyun-sg
        kubeconfig: "${KUBECONFIG_READONLY_PROD}"
        context: "${K8S_CONTEXT_PROD}"
        namespace: "${K8S_NAMESPACE_PROD}"
        kubectl_bin: "${KUBECTL_BIN_PROD}"
        readonly: true
      - id: intlsms-test
        business_line: intlsms
        environment: test
        cluster: test-aliyun-zjk
        kubeconfig: "${KUBECONFIG_READONLY_TEST}"
        context: "${K8S_CONTEXT_TEST}"
        namespace: intl-test
        kubectl_bin: "${KUBECTL_BIN_TEST}"
        readonly: true
