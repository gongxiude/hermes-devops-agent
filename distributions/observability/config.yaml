display:
  skin: slate


model:
  provider: deepseek-relay
  model: deepseek-v4-pro
  default: deepseek-v4-pro
  api_mode: chat_completions

fallback_providers:
- provider: custom
  model: deepseek-v4-pro
  base_url: "${CUSTOM_BASE_URL}"
  api_key: "${CUSTOM_API_KEY}"
  api_mode: chat_completions


custom_providers:
- name: deepseek-relay
  base_url: "${CUSTOM_BASE_URL}"
  api_key: "${CUSTOM_API_KEY}"
  model: deepseek-v4-pro
  api_mode: chat_completions
  models:
    deepseek-v4-pro:
      name: deepseek-v4-pro

- name: gpt-relay
  base_url: "${CUSTOM_BASE_URL}"
  api_key: "${GPT_RELAY_API_KEY}"
  model: gpt-5.5
  api_mode: chat_completions
  models:
    gpt-5.5:
      name: gpt-5.5

hooks_auto_accept: false

agent:
  max_turns: 30

plugins:
  enabled:
    - observability
    - kubernetes
  disabled:
    - devops_agent
    - devops_governance

toolsets:
  - kanban
  - observability
  - kubernetes
  - memory
  - terminal

# Kanban dispatcher resolves worker toolsets from the assignee profile's
# effective CLI toolsets and passes them as an explicit --toolsets pin.
# Keep only the read-only tools needed by observability workers.
platform_toolsets:
  cli:
    - kanban
    - kubernetes
    - memory
    - observability
    - terminal

terminal:
  cwd: /opt/data/profiles/observability/workspace

# MCP servers — 运行时实际读取此配置（mcp.json 仅为 distribution 交付格式）
# 注意：Prometheus 已从 MCP 迁移到原生插件 `observability`（见下方 observability: 段）。
mcp_servers:
  loki-intlsms-prod:
    command: /opt/hermes/.venv/bin/python
    args:
      - /opt/mcp-servers/loki/src/server.py
    env:
      MCP_SERVER_NAME: loki-intlsms-prod
      LOKI_URL: "${OBSERVE_LOKI_BASE_URL_PROD}"
      LOKI_USERNAME: "${OBSERVE_LOKI_USERNAME_PROD}"
      LOKI_PASSWORD: "${OBSERVE_LOKI_PASSWORD_PROD}"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - loki_backend_health
        - loki_query_range
        - loki_labels
        - loki_label_values
        - loki_series
  # loki-intlsms-test:
  #   command: /opt/hermes/.venv/bin/python
  #   args:
  #     - /opt/mcp-servers/loki/src/server.py
  #   env:
  #     MCP_SERVER_NAME: loki-intlsms-test
  #     LOKI_URL: "${OBSERVE_LOKI_BASE_URL_TEST}"
  #     LOKI_TOKEN: "${OBSERVE_LOKI_TOKEN_TEST}"
  #     MCP_LOG_LEVEL: INFO
  #   tools:
  #     include:
  #       - loki_backend_health
  #       - loki_query_range
  #       - loki_labels
  #       - loki_label_values
  #       - loki_series

# Profile-specific settings
observability_query:
  service_domain: intlsms
  agent_distribution: hermes-devops-agent
  supported_environments:
    - prod
    - test
  default_environment: prod
  default_window: 15m
  max_window: 2h
  report_format: markdown
  readonly: true

# observability 插件的多实例 catalog（按后端分段）。
# 工具根据提示词选择 业务线/环境/集群 → 命中唯一 target → 用其 base_url/token 连接。
# base_url/token 写 ${VAR}，由 load_config() 自动从 .env 展开。
# 新增业务线/实例：在对应后端 targets 追加一条 + .env 加变量，无需改代码。
observability:
  prometheus:
    default_category: intlsms
    default_env: prod
    targets:
      - id: intlsms-prod
        category: intlsms
        env: prod
        cluster: aliyun-sg
        base_url: "${OBSERVE_PROMETHEUS_BASE_URL_PROD}"
        token: "${OBSERVE_PROMETHEUS_TOKEN_PROD}"
        auth_scheme: Basic
      - id: intlsms-test
        category: intlsms
        env: test
        cluster: aliyun-zjk
        base_url: "${OBSERVE_PROMETHEUS_BASE_URL_TEST}"
        token: "${OBSERVE_PROMETHEUS_TOKEN_TEST}"
        auth_scheme: Bearer
  # loki:            # 【未来】结构同上；target 增加 username/password 等 loki 专属字段
  #   default_category: intlsms
  #   default_env: prod
  #   targets: []

# kubernetes 插件只读多集群:集群来自下方共享 clusters: 注册表。
kubernetes:
  default_category: intlsms
  default_env: prod

# 共享集群注册表(单一真源,kubernetes 插件 + 未来 argocd 插件共用)。
# 对齐你的 ArgoCD destination 维度:category(业务线)× env × 物理集群。
# context = 本机 kubeconfig 里能连到该物理集群的上下文名;namespace = 默认命名空间。
# 多个 destination 可共用同一物理 context(如 intlsms-test 与 datacenter-test 同集群)。
# server/overlayEnv/manualSync/... 等 GitOps 元数据留给未来 argocd 插件,k8s 只读忽略。
clusters:
  prod-aliyun-sg-intlsms:
    category: intlsms
    env: prod
    cluster: aliyun-sg
    server: https://10.100.17.201:6443
    namespace: prod
    context: prod-aliyun-sg-intlsms
  test-aliyun-zjk-intlsms:        # 同物理集群=test-aliyun-zjk-datacenter,走其 context + intl-test ns（待确认）
    category: intlsms
    env: test
    cluster: aliyun-zjk
    server: https://47.92.210.170:6443
    namespace: intl-test
    context: test-aliyun-zjk-datacenter
  test-aliyun-zjk-datacenter:
    category: datacenter
    env: test
    cluster: aliyun-zjk
    server: https://47.92.210.170:6443
    namespace: test
    context: test-aliyun-zjk-datacenter
  prod-aliyun-sh-datacenter:
    category: datacenter
    env: prod
    cluster: aliyun-sh
    server: https://172.25.15.116:6443
    namespace: ""
    context: prod-aliyun-sh-datacenter
  prod-aliyun-zjk-ops:
    category: ops
    env: prod
    cluster: aliyun-zjk
    server: https://kubernetes.default.svc
    namespace: ""
    context: prod-aliyun-zjk-ops
  prod-aliyun-zjk-ai:             # 疑似 ops 集群的 yuexin-ai 命名空间，走 ops context（待确认）
    category: ai
    env: prod
    cluster: aliyun-zjk
    server: https://kubernetes.default.svc
    namespace: yuexin-ai
    context: prod-aliyun-zjk-ops
