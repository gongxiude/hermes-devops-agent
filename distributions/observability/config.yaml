display:
  skin: slate

hooks_auto_accept: false

plugins:
  enabled:
    - devops_agent
    - observability
    - kubernetes

terminal:
  cwd: /Users/gongxiude/Documents/yuexin/hermes-devops-agent

# MCP servers — 运行时实际读取此配置（mcp.json 仅为 distribution 交付格式）
# 注意：Prometheus 已从 MCP 迁移到原生插件 `observability`（见下方 observability: 段）。
mcp_servers:
  loki-intlsms-prod:
    command: python3
    args:
      - /Users/gongxiude/Documents/yuexin/hermes-devops-agent/mcp-servers/loki/src/server.py
    env:
      MCP_SERVER_NAME: loki-intlsms-prod
      LOKI_URL: "${OBSERVE_LOKI_BASE_URL_PROD}"
      LOKI_USERNAME: "${OBSERVE_LOKI_USERNAME_PROD}"
      LOKI_PASSWORD: "${OBSERVE_LOKI_PASSWORD_PROD}"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - loki_backend_health
        - loki_query_range
        - loki_labels
        - loki_label_values
        - loki_series
