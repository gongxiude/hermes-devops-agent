display:
  skin: slate

hooks_auto_accept: false

plugins:
  enabled:
    - devops_agent

terminal:
  cwd: /Users/gongxiude/Documents/github/infrastructure-agents-guide

# MCP servers — 运行时实际读取此配置（mcp.json 仅为 distribution 交付格式）
mcp_servers:
  prometheus-intlsms-prod:
    command: python3
    args:
      - mcp-servers/prometheus/src/server.py
    env:
      MCP_SERVER_NAME: prometheus-intlsms-prod
      PROMETHEUS_URL: "${OBSERVE_PROMETHEUS_BASE_URL_PROD}"
      PROMETHEUS_TOKEN: "${OBSERVE_PROMETHEUS_TOKEN_PROD}"
      PROMETHEUS_AUTH_SCHEME: "Basic"
      ENABLE_DISCOVERY_TOOLS: "false"
      ENABLE_INFO_TOOLS: "false"
      ENABLE_QUERY_TOOLS: "true"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - prometheus_query
        - prometheus_query_range
  prometheus-intlsms-test:
    command: python3
    args:
      - mcp-servers/prometheus/src/server.py
    env:
      MCP_SERVER_NAME: prometheus-intlsms-test
      PROMETHEUS_URL: "${OBSERVE_PROMETHEUS_BASE_URL_TEST}"
      PROMETHEUS_TOKEN: "${OBSERVE_PROMETHEUS_TOKEN_TEST}"
      ENABLE_DISCOVERY_TOOLS: "false"
      ENABLE_INFO_TOOLS: "false"
      ENABLE_QUERY_TOOLS: "true"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - prometheus_query
        - prometheus_query_range
  loki-intlsms-prod:
    command: python3
    args:
      - /Users/gongxiude/Documents/github/infrastructure-agents-guide/hermes-devops-agent/mcp-servers/loki/src/server.py
    env:
      MCP_SERVER_NAME: loki-intlsms-prod
      LOKI_URL: "${OBSERVE_LOKI_BASE_URL_PROD}"
      LOKI_USERNAME: "${OBSERVE_LOKI_USERNAME_PROD}"
      LOKI_PASSWORD: "${OBSERVE_LOKI_PASSWORD_PROD}"
      MCP_LOG_LEVEL: INFO
    tools:
      include:
        - loki_backend_health
        - loki_query_range
        - loki_labels
        - loki_label_values
        - loki_series
  # loki-intlsms-test:
  #   command: python3
  #   args:
  #     - /Users/gongxiude/Documents/github/infrastructure-agents-guide/hermes-devops-agent/mcp-servers/loki/src/server.py
  #   env:
