name: hermes-devops-orchestrator
version: 0.2.0
description: "DevOps Orchestrator — Feishu gateway, Kanban routing with inline intent parsing. Never executes ops actions directly."
hermes_requires: ">=0.12.0"
author: "Platform Engineering"
env_requires:
  - name: FEISHU_APP_ID
    description: "Feishu App ID for the DevOps Bot"
    required: true
  - name: FEISHU_APP_SECRET
    description: "Feishu App Secret"
    required: true
  - name: FEISHU_ALLOWED_USERS
    description: "Comma-separated Feishu open_ids to allow, or * for all"
    required: false
  - name: FEISHU_HOME_CHANNEL
    description: "Default Feishu chat_id for result notifications"
    required: false
distribution_owned:
  - SOUL.md
  - config.yaml
  - mcp.json
  - cron/
  - skills/orchestrator/
