      name: gpt-5.5



# Orchestrator 只有 kanban + skills，不挂任何 MCP 生产系统
toolsets:
  - kanban
  - skills
  - memory

platform_toolsets:
  cli:
    - kanban
    - memory
    - skills
  feishu:
    - kanban
    - memory
    - skills
  api_server:
    - kanban
    - memory
    - skills

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 3     # 降低调度延迟（原 15s）
  max_in_progress: 10
  max_in_progress_per_profile: 1
  max_spawn: 1
  failure_limit: 2
  auto_promote_children: true
  auto_decompose: false             # 关闭自动任务拆解，减少调度噪音
  orchestrator_profile: orchestrator

platforms:
  feishu:
    enabled: true
    extra:
      connection_mode: websocket
      domain: feishu
      allow_bots: none
      require_mention: true
      # default_group_policy: allowlist  # 改为 open 则所有群组均可访问
      default_group_policy: open

plugins:
  enabled: []
  disabled:
    - devops_agent
