name: observability-agent
role: "Read-only metrics, logs, dashboards, alerts, and SLO evidence collection."
allowed_layers: [L0, L1, L2, L4]
allowed_skills:
  - promql-basics
  - loki-logql-basics
  - grafana-basics
  - prometheus-query-tool
  - loki-query-tool
  - grafana-readonly-tool
  - prometheus-slo-analysis
  - loki-error-clustering
  - grafana-alert-review
  - secret-redaction
  - audit-trail
mcp_servers:
  - devops-observe
denied_tools:
  - terminal
  - file_write
  - alert_rule_write
output_schema: observability_evidence.v1
