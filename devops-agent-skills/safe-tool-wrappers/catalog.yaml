name: l1-safe-tool-wrappers
version: 0.1.0
layer: L1
implementation_status: contract-only
decision: "L1 skills are MCP-backed safe wrapper contracts, not a second tool runtime."
contract_rules:
  - "Declare the MCP server/tool names that execute the operation."
  - "Declare allowed roles, environments, resources, verbs, and output schema."
  - "Declare denied operations even when the MCP server should also deny them."
  - "Declare audit fields: correlation_id, actor, role, service, environment, policy_decision, credential_scope, mcp_tool."
  - "Do not place credentials, shell scripts, or production secrets in SKILL.md."
skills:
  - name: intlsms-runtime-inspection-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["inspect", "dry_run", "report"]
    denied_verbs: ["restart", "rollback", "scale", "sync", "apply", "patch", "delete", "db_change"]
    depends_on: ["promql-basics", "loki-logql-basics", "kubectl-basics", "kubernetes-object-basics"]
  - name: k8s-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["get", "list", "watch", "logs"]
    denied_verbs: ["create", "patch", "update", "delete", "apply", "exec_write"]
    depends_on: ["kubectl-basics", "kubernetes-object-basics"]
  - name: kustomize-render-tool
    mcp_servers: ["devops-gitops-draft"]
    allowed_verbs: ["render", "locate_patch", "summarize_manifest"]
    denied_verbs: ["apply", "sync", "push"]
    depends_on: ["kustomize-basics", "yaml-json-jq-basics"]
  - name: argocd-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["app_get", "app_diff", "app_history", "app_manifest"]
    denied_verbs: ["sync", "rollback", "delete", "project_modify"]
    depends_on: ["argocd-cli-basics", "argocd-gitops-basics"]
  - name: prometheus-query-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["query", "query_range", "series_metadata"]
    denied_verbs: ["admin_api", "unbounded_query"]
    depends_on: ["promql-basics"]
  - name: loki-query-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["query", "query_range", "label_values"]
    denied_verbs: ["unbounded_query", "raw_sensitive_log_export"]
    depends_on: ["loki-logql-basics"]
  - name: grafana-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["dashboard_read", "alert_read", "folder_read"]
    denied_verbs: ["dashboard_write", "alert_write", "service_account_write"]
    depends_on: ["grafana-basics"]
  - name: jenkins-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["job_read", "build_read", "log_read", "artifact_metadata_read"]
    denied_verbs: ["build_trigger", "job_config_write", "credential_read"]
    depends_on: ["jenkins-api-basics", "jenkinsfile-basics"]
  - name: alicloud-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["resource_read", "ack_read", "ram_sts_assume_readonly"]
    denied_verbs: ["resource_mutate", "ram_policy_write", "access_key_create"]
    depends_on: ["aliyun-ram-sts-basics"]
  - name: redis-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["info", "slowlog", "latency", "client_list", "memory_stats"]
    denied_verbs: ["del", "flushall", "flushdb", "config", "eval", "acl_write"]
    depends_on: ["redis-cli-acl-basics"]
  - name: postgres-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["catalog_read", "pg_stat_read", "lock_read", "replication_read"]
    denied_verbs: ["ddl", "dml_write", "grant", "revoke", "superuser"]
    depends_on: ["postgresql-privilege-basics"]
