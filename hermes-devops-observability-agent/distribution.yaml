name: hermes-devops-observability-agent
version: 0.1.0
description: "Hermes observability-query profile distribution. Phase 1 ships international SMS runtime inspection."
profile: observability-query
requirements:
  env:
    - OBSERVE_PROMETHEUS_BASE_URL
    - OBSERVE_LOKI_BASE_URL
    - KUBECONFIG_READONLY
  tools:
    - python3
    - kubectl
  skills:
    - promql-basics
    - loki-logql-basics
    - kubectl-basics
    - kubernetes-object-basics
    - observability-health-query
    - intlsms-runtime-inspection
preserve_user_data:
  - .env
  - memories
  - sessions
  - state
  - api_keys
phase1_acceptance:
  - "python3 devops-agent-skills/scripts/validate_catalog.py"
  - "python3 -m pytest hermes-devops-observability-agent/tests"
  - "python3 hermes-devops-observability-agent/tests/validate_distribution.py"
