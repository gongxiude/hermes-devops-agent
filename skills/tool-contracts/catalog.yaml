name: l1-safe-tool-wrappers
version: 0.1.0
layer: L1
implementation_status: contract-only
decision: "L1 skills are MCP-backed safe wrapper contracts, not a second tool runtime."
contract_rules:
  - "Declare the MCP server/tool names that execute the operation."
  - "Declare allowed roles, environments, resources, verbs, and output schema."
  - "Declare denied operations even when the MCP server should also deny them."
  - "Declare audit fields: correlation_id, actor, role, service, environment, policy_decision, credential_scope, mcp_tool."
  - "Do not place credentials, shell scripts, or production secrets in SKILL.md."
skills:
  - name: k8s-readonly-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["get", "list"]
    denied_verbs: ["create", "patch", "update", "delete", "apply", "exec_write", "scale", "rollout_restart"]
    depends_on: ["kubectl-basics", "kubernetes-object-basics"]
  - name: prometheus-query-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["query", "query_range", "series_metadata"]
    denied_verbs: ["admin_api", "unbounded_query"]
    depends_on: ["promql-basics"]
  - name: loki-query-tool
    mcp_servers: ["devops-observe"]
    allowed_verbs: ["query", "query_range", "label_values"]
    denied_verbs: ["unbounded_query", "raw_sensitive_log_export"]
    depends_on: ["loki-logql-basics"]
