name: l1-safe-tool-wrappers
version: 0.1.0
layer: L1
implementation_status: contract-only
decision: "L1 skills are MCP-backed safe wrapper contracts, not a second tool runtime."
contract_rules:
  - "Declare the MCP server/tool names that execute the operation."
  - "Declare allowed roles, environments, resources, verbs, and output schema."
  - "Declare denied operations even when the MCP server should also deny them."
  - "Declare audit fields: correlation_id, actor, role, service, environment, policy_decision, credential_scope, mcp_tool."
  - "Do not place credentials, shell scripts, or production secrets in SKILL.md."
skills:
  - name: k8s-readonly-tool
    mcp_servers: ["k8s-intlsms-prod", "k8s-intlsms-test"]
    allowed_verbs: ["get", "list"]
    denied_verbs: ["create", "patch", "update", "delete", "apply", "exec_write", "scale", "rollout_restart"]
    depends_on: ["kubectl-basics", "kubernetes-object-basics"]
  - name: prometheus-query-tool
    mcp_servers: ["prometheus-intlsms-prod", "prometheus-intlsms-test"]
    allowed_verbs: ["query", "query_range", "series_metadata"]
    denied_verbs: ["admin_api", "unbounded_query"]
    depends_on: ["promql-basics"]
  - name: loki-query-tool
    mcp_servers: ["loki-intlsms-prod", "loki-intlsms-test"]
    allowed_verbs: ["query", "query_range", "label_values"]
    denied_verbs: ["unbounded_query", "raw_sensitive_log_export"]
    depends_on: ["loki-logql-basics"]
  - name: argocd-query-tool
    mcp_servers: ["argocd"]
    allowed_verbs: ["list_applications", "get_application", "get_project", "get_settings", "get_version"]
    denied_verbs: ["sync", "terminate_op", "delete_application", "update_project"]
    depends_on: ["argocd-basics"]
  - name: jenkins-readonly-tool
    mcp_servers: ["jenkins"]
    allowed_verbs: ["list_jobs", "get_job", "get_build", "get_console_tail"]
    denied_verbs: ["trigger_build", "replay_build", "update_job_config", "delete_build"]
    depends_on: ["jenkins-basics"]
  - name: git-codeup-readonly-tool
    mcp_servers: ["git-codeup"]
    allowed_verbs: ["list_repositories", "list_change_requests", "get_change_request", "list_commits", "local_git_status"]
    denied_verbs: ["push", "merge_change_request", "create_branch", "force_push"]
    depends_on: ["codeup-basics"]
  - name: git-workspace-draft-tool
    mcp_servers: ["git-workspace"]
    allowed_verbs: ["list_repos", "ensure_mirror", "create_worktree", "status", "diff", "run_checks", "cleanup_worktree"]
    denied_verbs: ["push", "merge", "force_push", "direct_master_write", "argocd_sync", "jenkins_trigger_build"]
    depends_on: ["codeup-basics"]
  - name: release-gate-tool
    mcp_servers: ["release-gate"]
    allowed_verbs: ["required_fields", "decide"]
    denied_verbs: ["jenkins_trigger_build", "argocd_sync", "argocd_rollback", "git_push", "git_merge", "kubectl_apply"]
    depends_on: ["jenkins-basics", "argocd-basics", "codeup-basics"]
  - name: release-executor-tool
    mcp_servers: ["release-executor"]
    allowed_verbs: ["jenkins_trigger_build", "argocd_sync", "argocd_rollback"]
    denied_verbs: ["git_push", "git_merge", "kubectl_apply", "kubectl_patch", "kubectl_delete", "rollout_restart", "scale"]
    depends_on: ["release-gate-tool", "jenkins-basics", "argocd-basics", "codeup-basics"]
  - name: aliyun-readonly-tool
    mcp_servers: ["aliyun"]
    allowed_verbs: ["describe_instances", "describe_instance_types", "describe_metric_last", "describe_metric_list"]
    denied_verbs: ["start_instance", "stop_instance", "reboot_instance", "modify_instance", "create_scaling_rule"]
    depends_on: ["aliyun-basics"]
